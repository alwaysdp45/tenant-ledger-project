services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tenant_ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5432:5432"
    volumes:
      - ledger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d tenant_ledger"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  ledger_pgdata:
